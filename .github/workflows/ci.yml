# Tests (cmake/ctest) on every pull request; on a v* tag push, tests + build + release
# (ForzaMotorsport_ExtraOptions-<tag>.zip: winmm.dll + azimuth_fm5.ini + azimuth_fm6.ini + README.txt).
# The tests that need the game exes (game_binaries\, not in git) are skipped on GitHub.
name: CI

on:
  pull_request:
  push:
    tags: ['v*']

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-2025
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4

      - name: Toolchain
        run: |
          [ -x /c/mingw64/bin/g++.exe ] || { echo "::error::C:\\mingw64\\bin\\g++.exe missing on the runner"; exit 1; }
          command -v ninja >/dev/null || choco install ninja -y --no-progress
          echo "/c/mingw64/bin" >> "$GITHUB_PATH"

      - name: Configure
        run: cmake --preset default

      - name: Build
        run: cmake --build --preset default

      # includes winmm_imports: winmm.dll ships alone, so it may only import system DLLs
      - name: Test
        run: ctest --preset default

      - name: Package
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          mkdir -p dist
          cp build/winmm.dll azimuth_fm5.ini azimuth_fm6.ini dist/
          cp README.md dist/README.txt
          cd dist && 7z a "../ForzaMotorsport_ExtraOptions-$GITHUB_REF_NAME.zip" winmm.dll azimuth_fm5.ini azimuth_fm6.ini README.txt

      - uses: actions/upload-artifact@v4
        if: startsWith(github.ref, 'refs/tags/v')
        with:
          name: release-zip
          path: ForzaMotorsport_ExtraOptions-${{ github.ref_name }}.zip

  release:
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: release-zip

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: >
          gh release create "$GITHUB_REF_NAME" "ForzaMotorsport_ExtraOptions-$GITHUB_REF_NAME.zip"
          --repo "$GITHUB_REPOSITORY" --title "$GITHUB_REF_NAME" --generate-notes
