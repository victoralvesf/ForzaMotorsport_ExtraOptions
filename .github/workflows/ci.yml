# Tests (cmake/ctest) on every pull request; on a v* tag push, tests + build + release
# (ForzaMotorsport_ExtraOptions-<tag>.zip: winmm.dll + motorsport_extraoptions.ini + README.txt; the release
# text is the CHANGELOG.md section "## <tag> ...").
# The tests that need the game exes (game_binaries\, not in git) are skipped on GitHub.
# workflow_dispatch (temporary): tests + package with the "## Unreleased" notes, no release.
name: CI

on:
  pull_request:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-2025
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4

      - name: Toolchain
        run: |
          [ -x /c/mingw64/bin/g++.exe ] || { echo "::error::C:\\mingw64\\bin\\g++.exe missing on the runner"; exit 1; }
          command -v ninja >/dev/null || choco install ninja -y --no-progress
          echo "/c/mingw64/bin" >> "$GITHUB_PATH"

      - name: Configure
        run: cmake --preset default

      - name: Build
        run: cmake --build --preset default

      # includes winmm_imports: winmm.dll ships alone, so it may only import system DLLs
      - name: Test
        run: ctest --preset default

      - name: Package
        if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch'
        run: |
          mkdir -p dist
          cp build/winmm.dll motorsport_extraoptions.ini dist/
          build/md2txt.exe README.md dist/README.txt
          cd dist && 7z a "../ForzaMotorsport_ExtraOptions-$GITHUB_REF_NAME.zip" winmm.dll motorsport_extraoptions.ini README.txt

      # body of the "## <tag> — title" section (up to the next "## "); a dispatch run uses "## Unreleased"
      - name: Release notes
        if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch'
        run: |
          if [ "$GITHUB_EVENT_NAME" = workflow_dispatch ]; then section=Unreleased; else section=$GITHUB_REF_NAME; fi
          awk -v s="$section" '/^## /{ if (f) exit; if ($0 == "## " s || index($0, "## " s " ") == 1) f = 1; next } f' \
            CHANGELOG.md > release_notes.md
          grep -q '[^[:space:]]' release_notes.md || { echo "::error::no '## $section' section in CHANGELOG.md"; exit 1; }
          cat release_notes.md

      - uses: actions/upload-artifact@v4
        if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch'
        with:
          name: release-zip
          path: |
            ForzaMotorsport_ExtraOptions-${{ github.ref_name }}.zip
            release_notes.md

  release:
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: release-zip

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: >
          gh release create "$GITHUB_REF_NAME" "ForzaMotorsport_ExtraOptions-$GITHUB_REF_NAME.zip"
          --repo "$GITHUB_REPOSITORY" --title "$GITHUB_REF_NAME" --notes-file release_notes.md
