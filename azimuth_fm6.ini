; =============================================================================
;  Azimuth Motorsport + Extra Options mod (Forza Motorsport 6)
;  Author: Victor Alves (L0rdDarkside)
;
;  Extra options for Forza Motorsport 6 Mod.
;  This file ONLY works for Forza Motorsport 6: it has no effect on
;  Forza Motorsport 5, Forza Horizon 2 or any other game running in Azimuth.
; =============================================================================
[FM6]
; 1 = skips the opening videos and goes straight to loading
; 0 = original behavior
SkipIntro=1

; 1 = skips the game's presentation video (IE_Blockbuster.bk2, played before the first race
;     of a new profile) and the intro videos of the Porsche/NASCAR expansions
; 0 = original behavior
SkipPresentationVideo=1

; 1 = unlocks the DLC cars/packs already included in the game (Car Pass, car packs, VIP,
;     Porsche/NASCAR expansions...): they count as purchased and the cars show up to buy
;     with in-game credits.
; 0 = original behavior
UnlockDLC=1

; 1 = smooth edges on alpha-to-coverage surfaces (car liveries/decals, fences, foliage, crowd):
;     the pixel shader turns alpha into MSAA coverage like the console does. Without it the PC
;     graphics driver dithers the coverage and the edges show a 1-pixel checkerboard pattern.
; 0 = coverage left to the graphics driver (original Azimuth behavior)
AlphaToCoverageNoDither=1
