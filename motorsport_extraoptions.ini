; =============================================================================
;  Forza Motorsport Extra Options
;  Author: Victor Alves (L0rdDarkside)
;
;  Extra options for Forza Motorsport 5 and Forza Motorsport 6 on Azimuth 1.0.2
;  or later. [FM5] only applies to Forza Motorsport 5 (package 1.0.0.20) and
;  [FM6] only to Forza Motorsport 6 (package 1.0.0.44); other games running in
;  Azimuth are not affected.
;  1 = on, 0 = off; a missing option is off. Log: fm_extra_options.log
;  The same options are in Azimuth: game settings > Extra Options (saved here).
; =============================================================================

; -----------------------------------------------------------------------------
;  Global (both games; not shown in Azimuth)
; -----------------------------------------------------------------------------
[GLOBAL]
; 1 = does not write fm_extra_options.log (and deletes the one of an earlier run)
; 0 = writes the log (default)
DisableLog=0

; -----------------------------------------------------------------------------
;  Forza Motorsport 5
; -----------------------------------------------------------------------------
[FM5]
; 1 = skips the opening video (T10 / Microsoft Studios) and goes straight to the title screen
; 0 = original behavior
SkipIntro=1

; 1 = skips the presentation video (IE_Blockbuster) that plays after the brightness screen and goes straight to the 1st race
; 0 = original behavior
SkipPresentationVideo=0

; 1 = unlocks the DLC cars/packs already included in the game (Car Pass, car packs, VIP...).
; they count as purchased and the cars show up to buy with in-game credits.
; 0 = original behavior (Azimuth's own DLC support)
UnlockDLC=1

; 1 = enables the Marketplace option in the menu without Xbox Live (shows the game's DLC packs).
; 0 = original
EnableMarketplace=1

; 1 = keeps the frame rate chosen in Azimuth in menus and transitions too
;     (the game itself halves it there; races already run at the chosen rate)
; 0 = original behavior
UnlockMenuFrameRate=1

; -----------------------------------------------------------------------------
;  Forza Motorsport 6
; -----------------------------------------------------------------------------
[FM6]
; 1 = skips the opening videos and goes straight to loading
; 0 = original behavior
SkipIntro=1

; 1 = skips the game's presentation video (IE_Blockbuster.bk2, played before the first race
;     of a new profile) and the intro videos of the Porsche/NASCAR expansions
; 0 = original behavior
SkipPresentationVideo=0

; 1 = unlocks the DLC cars/packs already included in the game (Car Pass, car packs, VIP,
;     Porsche/NASCAR expansions...): they count as purchased and the cars show up to buy
;     with in-game credits.
; 0 = original behavior (Azimuth's own DLC support)
UnlockDLC=1

; 1 = keeps the frame rate chosen in Azimuth in menus and transitions too
;     (the game itself halves it there; races already run at the chosen rate)
; 0 = original behavior
UnlockMenuFrameRate=1

; 1 = adds a fifth rim category, "Stock Rims (All Cars)", in Upgrades > rim style: the stock rims
;     of every car in the game, by make in alphabetical order (free), to fit on any car.
;     Before turning this option off, put back a rim of the game on the cars that use one of them.
; 0 = original behavior
StockWheels=0
