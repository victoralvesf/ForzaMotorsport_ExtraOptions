; =============================================================================
;  Azimuth For FM5 - debug options (development only, not shipped in the release)
;
;  Diagnostics for the winmm.dll proxy (read when azimuth.exe starts).
;  Applies to every game the proxy handles (Forza Motorsport 5 and 6).
; =============================================================================
[Debug]
; 1 = D3D12 debug layer (validation messages in azimuth_fm5.log, prefix "d3d12:")
; 2 = same + GPU-based validation (much slower)
; 3+ = DRED breadcrumbs + experiments (see winmm_proxy/debug12_fm5.c)
; 0 = off
D3D12Debug=0

; with D3D12Debug=8: which draws never reach the GPU
; 0 all, 1 direct, 2 replayer, 3-5 by type, 6 IA, 7 PSO hashes below, 8 DS/HS/GS/SO
DrawSkip=5

; with DrawSkip=7: PSO hashes (hex, separated by comma/space)
DrawSkipHashes=268c097b,22d997ee,b358e66f,5a129d3e,03622cb9,5be956aa,e93ddbe3,91f8bae6,ee5cc044,cd325816,cac354dd
