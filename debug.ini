; =============================================================================
;  Azimuth Motorsport - debug options (development only, not shipped in the release)
;
;  Diagnostics for the winmm.dll proxy (read when azimuth.exe starts).
;  Applies to every game the proxy handles (Forza Motorsport 5 and 6).
; =============================================================================
[Debug]
; 1 = D3D12 debug layer (validation messages in azimuth_motorsport.log, prefix "d3d12:")
; 2 = same + GPU-based validation (much slower)
; 3+ = DRED breadcrumbs + experiments (see winmm_proxy/debug12_fm5.c)
; 0 = off
D3D12Debug=0

; 0 = D3D12CreateDevice is not hooked: none of the proxy's D3D12 hooks (FM6 fixes, command list pool, DeferRelease,
; recording lists, placed placement textures); FM6 is not expected to run right like this. For diagnosing overlays
; (RivaTuner). 2 = only the gpuguard hooks, 3 = only the stutter/pool/placement hooks. Ignored with D3D12Debug.
; Default 1
;D3D12Hooks=1

; with D3D12Debug=8: which draws never reach the GPU
; 0 all, 1 direct, 2 replayer, 3-5 by type, 6 IA, 7 PSO hashes below, 8 DS/HS/GS/SO
DrawSkip=5

; with DrawSkip=7: PSO hashes (hex, separated by comma/space)
DrawSkipHashes=268c097b,22d997ee,b358e66f,5a129d3e,03622cb9,5be956aa,e93ddbe3,91f8bae6,ee5cc044,cd325816,cac354dd

; 1 = log of frame spikes (stutters) in azimuth_motorsport.log, prefix "stutter:": frames >= 25 ms and >= 1.8x the
; average, with PSO/resource creation, ExecuteCommandLists and long waits in that frame; 10 s summaries and
; throughput lines (GPU busy, command lists, draws, CPU per thread). 0 = off
StutterLog=0

; with StutterLog: GPU time of each group of command lists on the direct queue (timestamp lists interleaved in the
; same ExecuteCommandLists); groups slower than N ms are logged ("GPU lenta") with the lists' busiest draw sites and
; PSO hashes, and GPU gaps of N ms or more between submissions ("GPU parada ... ANTES"). Default 50; 0 = off
;GpuSlowMs=50

; works without StutterLog: the last reference the 'Azimuth reaper' thread drops on a D3D12 resource/heap is kept
; and released slowly by a proxy thread (<= 0.5 ms every ~2 ms), instead of hundreds in one frame (frame stutters;
; with TileNoHazard it also avoided a GPU reset). FM6 has it on by default; this overrides it. 0 = off. Leave it out
; to keep the per-game default
;DeferRelease=1

; with DeferRelease: minimum time (ms) an object waits in the queue before it is released, so the GPU is long done
; with it (the FM6 end-of-race GPU reset follows a burst of ~100 reaper releases). FM6 default 2000, others 0.
; Leave it out to keep the per-game default
;DeferReleaseHoldMs=2000

; works without StutterLog: Azimuth maps the tiles of each streamed texture with one UpdateTileMappings call on the
; render queue; 1 = D3D12_TILE_MAPPING_FLAG_NO_HAZARD on mappings so the driver does not sync the queue for each call
; (frame stutters). FM6 has it on by default; this overrides it. 0 = off. Leave it out to keep the per-game default
;TileNoHazard=1

; works without StutterLog: Azimuth destroys a pooled D3D12 command allocator once it has been idle for 4000 ms, one
; per command list open, on game threads (frame stutters). FM6 never destroys them by default; this overrides it.
; N = idle time in ms before destroying; -1 = never; 0 = unchanged (4000). Leave it out to keep the per-game default
;AllocatorMaxAgeMs=-1

; works without StutterLog: Azimuth takes one D3D12 command allocator from its pool for every command list it opens;
; FM6 opens 400-1200 lists per frame, so thousands of allocators are alive with the lists in flight, and the AMD
; driver keeps ~1.1 MB in each one it used (FM6 end-of-race crash: ~11 GB private memory, "Kernel memory failure").
; N = command lists opened on the same thread share one allocator, up to N per allocator (it goes back to Azimuth's
; pool once all of them were submitted, with the highest fence). EXPERIMENT: default 0 = off (one per list, as in
; Azimuth); with 64 FM6 crashed twice while loading the race
;AllocatorShare=0

; works without StutterLog: Azimuth creates a new D3D12 command list for every recording (deferred context or queue
; execution) and destroys it later (half a million per session, CPU cost in the driver). 1 = the last Release keeps
; the list and the next CreateCommandList of the same type reuses it with Reset. FM6 has it on by default; this
; overrides it. 0 = off. Leave it out to keep the per-game default
;ListPool=1

; FM6 resource batches (SetFastResourcesFromBatch): each batch record keeps a reference to the SRV it was built
; with (the console copies the descriptor, so the game may release the view right after building the batch).
; FM6 has it on by default; 0 = off (raw pointer, as before). With it on, SRVs the game already released but a
; batch still applies are logged ("ja solto pelo jogo")
;BatchHoldRefs=1

; EXPERIMENT (FM6 end-of-race GPU reset; diagnostic only, it makes the GPU slow): Azimuth returns a released
; view's descriptor slot to its pool once the GPU passes the batch submitted at the time; N = wait N more
; submissions (~13 per frame) before returning descriptor slots. 0 = off (default)
;RetireMargin=0

; FM6: Azimuth's immediate context binds shader resource views without holding a reference (its deferred context
; does), and the worker thread reads the view's descriptor later, at the draw; the game may release a view still
; bound. The proxy holds a reference to every view bound on the immediate context and releases a replaced one only
; after N ms. FM6 default 1000; 0 = off. Views the game released while still bound are logged
;ImmediateSrvHoldMs=1000

; FM6: Azimuth turns every placement texture into a reserved (tiled) resource on GPUs with tiled resources tier
; 4; FM6's texture streaming creates/destroys hundreds per second and the page table updates stall the GPU until
; the device is reset (end of the first race). 1 = committed resources instead (Azimuth's path for tier < 4).
; FM6 default 1; 0 = reserved, as in Azimuth
;PlacementCommitted=1

; FM6: with PlacementCommitted, every placement texture is a committed resource (~49k alive in a race, ~10 KiB of
; kernel nonpaged memory each). 1 = the proxy creates them as placed resources inside its own 64 MiB heaps
; (0.1 KiB of kernel memory each); the range goes back to the heap when the texture is released. FM6 default 1;
; 0 = committed, as in Azimuth. Leave it out to keep the per-game default
;PlacementPlaced=1

; FM6: with PlacementPlaced, the proxy tracks each placed texture (game address, age, who keeps it alive, Azimuth's
; refreshes of it); the report is logged only with StutterLog. Default 1; 0 = no tracking (also turns off
; PlacementReclaim)
;PlacementTrack=1

; FM6: the game loads new textures over the memory of older ones and keeps the old objects alive (on the console the
; memory is simply shared). 1 = when a new placed texture covers an older one, the older one's heap pages go back to
; the heap after PlacementReclaimHoldMs and newer textures reuse them (aliasing, as on the console); Azimuth's
; refreshes of such an orphan are skipped. Needs PlacementPlaced and PlacementTrack. Default 1; 0 = pages are only
; returned when the texture is released (memory grows over a session)
;PlacementReclaim=1

; with PlacementReclaim: time (ms) an orphan's pages wait before going back to the heap (GPU in flight). Default 2000
;PlacementReclaimHoldMs=2000


; FM6: Azimuth opens one D3D12 command list (and takes one command allocator) for every recorded piece: the immediate
; context's stream is split at every deferred list it executes, so FM6 sends ~600 lists per frame in ~17
; ExecuteCommandLists (FH2: ~15) with ~2000 allocators alive. 1 = Azimuth records into proxy "recorder" lists (CPU
; only) and each ExecuteCommandLists replays every run of them into ONE real list of the proxy (ClearState between
; them = a freshly opened list). FM6 default 1; 0 = one real list per piece, as in Azimuth. Leave it out to keep the
; per-game default
;ListMerge=1

; FM6: logs each distinct viewport / scissor rectangle once, with the game caller and game addresses on the stack
; (to find UI elements out of place with the launcher resolution). Default 0
;UiTrace=0

; FM6: livery (car paint) diagnostic: logs the livery render targets (size, samples), and while the game renders
; the car sections the pipelines it looks up (null = still compiling), draws Azimuth skipped, resolves, dispatches
; and textures it creates; also the large BC6H/BC7 textures (compressed output). Prefix "livery:". Default 0
LiveryLog=0

; FM6: press F9 in game to record the audio for N seconds (menu navigation click, step 114): audio_fm6_out.wav =
; the game's WASAPI output; audio_fm6_shape.bin = every SHAPE graph (SRC/XMA contexts and the 128 samples each
; voice sends to the game). Next to azimuth.exe; analyse with tools\audio_dump.py. Default 0 = off
AudioDump=60

; FM6: Azimuth drops the samples the XMA context asks to skip from FFmpeg's output, but FFmpeg already drops the first
; frame (512 samples) of every new decoder, so every sound lost its attack (menu navigation click, step 114). 1 = drop
; 512 fewer. FM6 default 1; 0 = as in Azimuth (also 1 tries it on FM5). Leave it out to keep the per-game default
;XmaStartFix=1
